name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build.sh reads the version from the tag and the build number from history
      - name: Test
        run: swift test
      - name: Build universal app
        run: ./build.sh --dist dist
      - name: Zip
        run: |
          cd dist
          ditto -c -k --keepParent ClaudeSiri.app "ClaudeSiri-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "ClaudeSiri-${GITHUB_REF_NAME}.zip" > "ClaudeSiri-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ClaudeSiri-*.zip dist/ClaudeSiri-*.zip.sha256 \
            --title "ClaudeSiri $GITHUB_REF_NAME" --generate-notes \
            --notes "Universal build (Apple Silicon + Intel), macOS 14 or later. The app is not notarized: on first launch, right-click ClaudeSiri.app › Open, or run \`xattr -dr com.apple.quarantine /Applications/ClaudeSiri.app\`. Requires Claude Code installed and logged in."
